<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hotel Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        /* Chatbot styles */
        #chatbot {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 300px;
            height: 400px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: flex; /* Ensure it's visible initially */
            flex-direction: column;
            overflow: hidden;
            z-index: 1000;
        }

        #chatbot-header {
            background-color: #4CAF50;
            color: white;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            cursor: pointer;
        }

        #chatbot-messages {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-size: 14px;
        }

        #chatbot-input {
            display: flex;
            border-top: 1px solid #ddd;
        }

        #chatbot-input input {
            flex: 1;
            padding: 10px;
            border: none;
            outline: none;
        }

        #chatbot-input button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
        }

        #chatbot-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
        }
    </style>
</head>
<body>
    <header>
        <h1>Hotel Management System</h1>
        <nav>
            <a href="/">Home</a>
            <a href="/rooms">Rooms</a>
            <a href="/customers">Customers</a>
            <a href="/bookings">Bookings</a>
            <a href="/admin">Admin</a>
        </nav>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <button id="chatbot-toggle">💬</button>

    <!-- Chatbot widget -->
    <div id="chatbot">
        <div id="chatbot-header">Assistant</div>
        <div id="chatbot-messages"></div>
        <div id="chatbot-input">
            <input type="text" id="chatbot-user-input" placeholder="Type your message...">
            <button id="chatbot-send">Send</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/scripts.js') }}"></script>
    <script>
        const chatbotToggle = document.getElementById('chatbot-toggle');
        const chatbot = document.getElementById('chatbot');
        const chatbotMessages = document.getElementById('chatbot-messages');
        const chatbotInput = document.getElementById('chatbot-user-input');
        const chatbotSend = document.getElementById('chatbot-send');

        chatbot.style.display = 'flex'; // Ensure it's visible initially
        chatbotToggle.addEventListener('click', () => {
            chatbot.style.display = chatbot.style.display === 'none' ? 'flex' : 'none';
        });

        chatbotSend.addEventListener('click', () => {
            const userMessage = chatbotInput.value.trim();
            if (userMessage) {
                addMessage('You', userMessage);
                chatbotInput.value = '';
                handleChatbotResponse(userMessage);
            }
        });

        function addMessage(sender, message) {
            const messageElement = document.createElement('div');
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            chatbotMessages.appendChild(messageElement);
            chatbotMessages.scrollTop = chatbotMessages.scrollHeight;
        }

        function handleChatbotResponse(userMessage) {
            let response = '';
            if (userMessage.toLowerCase().includes('available rooms')) {
                response = 'We have Single, Double, and Suite rooms available. Please specify your preference.';
            } else if (userMessage.toLowerCase().includes('family')) {
                response = 'The best rooms for families are our Suite rooms, which offer extra space and amenities.';
            } else {
                response = 'I am here to assist you. Please ask about available rooms, best rooms for families, or other queries.';
            }
            addMessage('Assistant', response);
        }
    </script>
</body>
</html>
