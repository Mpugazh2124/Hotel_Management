<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            background-image: url('https://images.hdqwalls.com/wallpapers/lake-nature-night-reflection-r1.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            backdrop-filter: brightness(0.7);
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .content {
            background: rgba(20, 19, 2, 0.75);
            padding: 30px;
            border-radius: 15px;
            display: inline-block;
            box-shadow: 0px 0px 25px rgba(255, 204, 0, 0.6);
            animation: floating 3s infinite alternate ease-in-out;
            transition: transform 0.3s ease-in-out;
        }

        @keyframes floating {
            from { transform: translateY(0px); }
            to { transform: translateY(-10px); }
        }

        h1 {
            font-size: 3em;
            color: #ffcc00;
            text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.8);
        }

        p {
            font-size: 1.5em;
            color: #f5f5f5;
            text-shadow: 0px 0px 10px rgba(255, 255, 255, 0.3);
        }

        .goodbye-btn {
            font-size: 18px;
            padding: 12px 25px;
            background: linear-gradient(to right, #ff5733, #ffcc00);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 0px 20px rgba(255, 87, 51, 0.6);
            margin-top: 20px;
        }

        .goodbye-btn:hover {
            background: linear-gradient(to right, #cc2900, #ff9900);
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <div class="content">
        <h1>✨ Thank You for Choosing Our Hotel! ✨</h1>
        <p>We hope to see you again soon. Safe travels! 🌍</p>
        <a href="{{url_for('home')}}"><button class="goodbye-btn">Return to Home</button></a>
    </div>
</body>
</html>
