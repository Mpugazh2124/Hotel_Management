<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Confirmation</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            font-size: 22px;
            text-align: center;
            background-image: url('https://images8.alphacoders.com/702/thumb-1920-702517.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed; 
            height: 100vh;
            margin: 0;
            padding: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.3);
        }

        h2 {
            font-size: 50px;
            color: #ffcc00; /* Gold color */
            margin-bottom: 20px;
            text-transform: uppercase;
            font-weight: 600;
        }

        p {
            font-size: 24px;
            margin: 10px 0;
            font-weight: 400;
        }

        .highlight {
            font-weight: 600;
            color: #ffcc00;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            margin-top: 20px;
            font-size: 20px;
            color: black;
            background-color: #ffcc00;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 0px 10px rgba(255, 204, 0, 0.6);
        }

        .btn:hover {
            background-color: #e6b800;
            transform: scale(1.1);
            box-shadow: 0px 0px 15px rgba(255, 204, 0, 0.9);
        }
    </style>
</head>
<body>
    <h2>Booking Confirmed!</h2>
    <p>Room <span class="highlight">{{ room_number }}</span> (<span class="highlight">{{ room_type }}</span>) has been successfully booked for <span class="highlight">{{ customer_name }}</span>!</p>
    <p><strong>From Date:</strong> <span class="highlight">{{ from_date }}</span></p>
    <p><strong>To Date:</strong> <span class="highlight">{{ to_date }}</span></p>
    <p><strong>Price per Day:</strong> ₹<span class="highlight">{{ price_per_day }}</span></p>
    <p><strong>Total Price:</strong> ₹<span class="highlight">{{ total_price }}</span></p>
    <a href="/" class="btn">Back to Home</a>
</body>
</html>
