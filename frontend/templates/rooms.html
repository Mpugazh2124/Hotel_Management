<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Rooms</title>
</head>
<body>
    <h2>Available Rooms</h2>
    <table border="1">
        <thead>
            <tr>
                <th>Room Number</th>
                <th>Type</th>
                <th>Price</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for room in rooms %}
            <tr>
                <td>{{ room.room_number }}</td>
                <td>{{ room.type }}</td>
                <td>₹{{ room.price }}</td>
                <td>{{ 'Available' if room.availability else 'Booked' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
