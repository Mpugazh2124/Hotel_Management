<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Food</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            text-align: center;
            background-image: url('https://foodsquare.co.in/wp-content/uploads/2015/11/Homepage-Banner-4.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            backdrop-filter: brightness(0.7);
        }

        h2 {
            font-size: 50px;
            margin-bottom: 20px;
            color: #ffcc00;
            text-shadow: 3px 3px 20px rgba(255, 255, 255, 0.8);
            animation: glowText 1.5s infinite alternate;
        }

        @keyframes glowText {
            from { text-shadow: 3px 3px 20px rgba(255, 255, 255, 0.8); }
            to { text-shadow: 3px 3px 30px rgba(255, 204, 0, 1); }
        }

        .order-form {
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            padding: 30px;
            width: 400px;
            box-shadow: 0px 0px 25px rgba(255, 204, 0, 0.6);
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .food-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.1);
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            transition: transform 0.3s ease-in-out, box-shadow 0.3s ease-in-out;
            color: white;
            font-size: 20px;
        }

        .food-item:hover {
            transform: scale(1.05);
            box-shadow: 0px 0px 20px rgba(255, 204, 0, 0.8);
        }

        input[type="checkbox"] {
            transform: scale(1.3);
            margin-right: 10px;
            cursor: pointer;
        }

        .order-btn {
            font-size: 22px;
            padding: 15px 30px;
            background: linear-gradient(to right, #ff5733, #ffcc00);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            width: 100%;
            font-weight: bold;
            box-shadow: 0px 0px 20px rgba(255, 87, 51, 0.6);
            animation: glowButton 1.5s infinite alternate;
        }

        @keyframes glowButton {
            from { box-shadow: 0px 0px 20px rgba(255, 87, 51, 0.6); }
            to { box-shadow: 0px 0px 30px rgba(255, 204, 0, 1); }
        }

        .order-btn:hover {
            background: linear-gradient(to right, #cc2900, #ff9900);
            transform: scale(1.08);
        }
    </style>
</head>
<body>
    <h2>🍕 Order Your Favorite Food 🍔</h2>
    <form method="POST" class="order-form">
        {% for food in food_items %}
            <label class="food-item">
                <input type="checkbox" name="{{ food.food_name }}" value="{{ food.food_name }}">
                <span>{{ food.food_name }} - ₹{{ food.price }}</span>
            </label>
        {% endfor %}
        <button type="submit" class="order-btn">Order Now</button>
    </form>
</body>
</html>
