<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Order Confirmation</title>
    <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Raleway', sans-serif;
            font-size: 22px;
            text-align: center;
            background-image: url('https://images.hdqwalls.com/wallpapers/beautiful-landscape-nature-scenery-1d.jpg'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            height: 100vh;
            margin: 0;
            padding: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 45px;
            color: #ffcc00;
            text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.4);
            animation: glow 1.5s infinite alternate;
        }

        @keyframes glow {
            from { text-shadow: 2px 2px 10px rgba(255, 255, 255, 0.4); }
            to { text-shadow: 0px 0px 20px rgba(255, 255, 255, 0.8); }
        }

        .card {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(15px);
            padding: 30px;
            border-radius: 15px;
            width: 50%;
            text-align: left;
            box-shadow: 0px 0px 20px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease-in-out;
        }

        .card:hover {
            transform: scale(1.03);
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            font-size: 20px;
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.3s ease-in-out;
        }

        li:hover {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
        }

        .total-price {
            font-size: 28px;
            font-weight: bold;
            color: #ffcc00;
            text-shadow: 1px 1px 10px rgba(255, 255, 255, 0.3);
        }

        .btn-home {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 18px;
            background: linear-gradient(45deg, #ff5733, #ffcc00);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0px 0px 10px rgba(255, 87, 51, 0.8);
        }

        .btn-home:hover {
            background: linear-gradient(45deg, #cc2900, #ff9900);
            transform: scale(1.05);
            box-shadow: 0px 0px 20px rgba(255, 87, 51, 1);
        }
    </style>
</head>
<body>
    <h2>Food Order Confirmation</h2>
    <div class="card">
        {% if ordered_items %}
            <h3>Ordered Items:</h3>
            <ul>
                {% for food in ordered_items %}
                    <li>{{ food.food_name }} - ₹{{ food.price }}</li>
                {% endfor %}
            </ul>
            <p class="total-price">Total Price: ₹{{ total_food_price }}</p>
        {% else %}
            <p>No food items were selected.</p>
        {% endif %}
    </div>
    <a href="{{ url_for('home') }}" class="btn-home">Back to Home</a>
</body>
</html>
